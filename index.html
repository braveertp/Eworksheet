<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Worksheet System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-slate-900 text-white p-6 shadow-lg mb-12">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold tracking-tight">E-Worksheet System</h1>
            <p class="text-slate-400 text-sm">Flight Inspection</p>
        </div>
    </header>

    <main class="container mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- ILS/DME Card -->
            <div onclick="navigateTo('ils')" class="glass-card p-8 rounded-2xl cursor-pointer flex flex-col items-center text-center group">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    <i class="fas fa-plane-arrival text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">ILS / DME</h2>
                <p class="text-slate-500 text-sm mt-2">Instrument Landing System</p>
            </div>

            <!-- VOR Card -->
            <div class="glass-card p-8 rounded-2xl cursor-not-allowed opacity-50 flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-broadcast-tower text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">VOR</h2>
                <p class="text-slate-500 text-sm mt-2">VHF Omni-directional Range</p>
            </div>

            <div class="glass-card p-8 rounded-2xl cursor-not-allowed opacity-50 flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-broadcast-tower text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">NDB</h2>
                <p class="text-slate-500 text-sm mt-2">Non-Directional Beacon</p>
            </div>

            <!-- PAPI Card -->
            <div class="glass-card p-8 rounded-2xl cursor-not-allowed opacity-50 flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-lightbulb text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">PAPI</h2>
                <p class="text-slate-500 text-sm mt-2">Precision Approach Path Indicator</p>
            </div>

            <!-- RADAR Card -->
            <div class="glass-card p-8 rounded-2xl cursor-not-allowed opacity-50 flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-satellite-dish text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">RADAR</h2>
                <p class="text-slate-500 text-sm mt-2">Surveillance Systems</p>
            </div>
        </div>
    </main>

    <script>
        // Static, offline navigation — each module is its own HTML file.
        // (No server / Google Apps Script involved anymore.)
        const PAGES = {
    ils: '/ils.html'
};

function navigateTo(page) {
    const target = PAGES[page];
    if (!target) return;

    window.location.href = target;
}
    </script>
</body>
</html>
