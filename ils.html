let airportDB = [];
let selectedAirport = null;
const AIRPORT_CACHE_KEY = 'airportDB';

// Airports are bundled directly into this file (BUNDLED_AIRPORTS).
// localStorage cache can still override with an imported custom list.
function loadAirports() {
    const cachedData = localStorage.getItem(AIRPORT_CACHE_KEY);
    if (cachedData) {
        try {
            const cached = JSON.parse(cachedData);
            if (Array.isArray(cached) && cached.length > 0) {
                airportDB = cached;
                console.log(`✅ Loaded ${airportDB.length} airports from local cache`);
                return;
            }
        } catch (e) {
            localStorage.removeItem(AIRPORT_CACHE_KEY);
        }
    }
    // Fall back to bundled data
    airportDB = BUNDLED_AIRPORTS;
    console.log(`✅ Loaded ${airportDB.length} airports from bundled data`);
}

function importAirportFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw new Error('not an array');

            airportDB = data;
            localStorage.setItem(AIRPORT_CACHE_KEY, JSON.stringify(data));
            alert(`Imported ${data.length} airports. They are now saved on this device for offline use.`);
        } catch (err) {
            alert('Could not read that file. Expecting a JSON array like:\n[{"icao":"VTBS","iden":"BKK","airport":"Suvarnabhumi","width":3.00,"angle":3.00,"category":"CAT I"}]');
        } finally {
            input.value = '';
        }
    };
    reader.readAsText(file);
}

function renderDropdown(list) {
    const dropdown = document.getElementById('airport-dropdown');
    dropdown.innerHTML = '';

    if (list.length === 0) {
        dropdown.classList.add('hidden');
        return;
    }

    list.forEach(ap => {
        const item = document.createElement('div');
        item.className = "p-3 hover:bg-gray-100 cursor-pointer";

        item.innerHTML = `
            <div class="font-bold">${ap.icao} / ${ap.iden}</div>
            <div class="text-sm text-gray-500">${ap.airport}</div>
        `;

        item.onclick = () => selectAirport(ap);

        dropdown.appendChild(item);
    });

    dropdown.classList.remove('hidden');
}

function selectAirport(ap) {
    selectedAirport = ap;

    document.getElementById('airport-search').value = `${ap.icao} / ${ap.iden}`;
    document.getElementById('airport-dropdown').classList.add('hidden');

    document.getElementById('airport-name').innerText = ap.airport;

    document.getElementById('init-width').value = Number(ap.width).toFixed(2);
    document.getElementById('init-angle').value = Number(ap.angle).toFixed(2);

    // ✅ เพิ่มตรงนี้
    if (ap.category) {
    const catEl = document.getElementById('init-category');
    catEl.value = ap.category;
    handleCategoryChange(catEl); // 👈 เพิ่มตรงนี้
}

    initialSettings.width = Number(ap.width).toFixed(2);
    initialSettings.angle = Number(ap.angle).toFixed(2);

    applyDynamicTolerance();
}

function formatDecimal(el) {
    if (el.value === '') return;
    el.value = Number(el.value).toFixed(2);
}

window.onload = function () {
    loadAirports();

    const resumed = loadFromLocal();

    if (resumed && initialSettings.ident) {
        // Pre-fill modal with saved values so user can confirm or change
        document.getElementById('airport-search').value = `${initialSettings.icao} / ${initialSettings.ident}`;
        document.getElementById('airport-name').innerText = initialSettings.airport || '';
        document.getElementById('init-width').value = Number(initialSettings.width || 0).toFixed(2);
        document.getElementById('init-angle').value = Number(initialSettings.angle || 0).toFixed(2);
        const catEl = document.getElementById('init-category');
        catEl.value = initialSettings.category || '';
        handleCategoryChange(catEl);
        toggleClearBtn();

        // Restore selectedAirport so submit uses correct data
        selectedAirport = {
            icao: initialSettings.icao,
            iden: initialSettings.ident,
            airport: initialSettings.airport || '',
            width: initialSettings.width,
            angle: initialSettings.angle,
            category: initialSettings.category
        };
    } else {
        document.getElementById('init-category').value = '';
        document.getElementById('init-width').value = '';
        document.getElementById('init-angle').value = '';
        handleCategoryChange(document.getElementById('init-category'));
    }

    if (resumed && initialSettings.ident) {
        // Session exists — resume directly without showing modal
        resumeSession();
    } else {
        // No session — show modal for first-time setup
        renderProfileOptions();
        document.getElementById('init-modal').classList.add('active');
        setTimeout(() => document.getElementById('airport-search').focus(), 500);
    }
};

function resumeSession() {
    document.getElementById('display-ident').innerText = `${initialSettings.icao} / ${initialSettings.ident}`;
    document.getElementById('display-airport').innerText = `${initialSettings.airport || ''} (${initialSettings.category || ''})`;
    document.getElementById('display-width').innerText = Number(initialSettings.width || 0).toFixed(2);
    document.getElementById('display-angle').innerText = Number(initialSettings.angle || 0).toFixed(2);

    document.getElementById('header-info').classList.remove('opacity-0');
    document.getElementById('init-modal').classList.remove('active');

    applyDynamicTolerance();
    renderProfileOptions();
    renderFields();

    updateNavBadge();
    if (currentRuns.length > 0) {
        renderRuns();
    }
}

function changeAirport() {
    document.getElementById('init-modal').classList.add('active');
    setTimeout(() => document.getElementById('airport-search').focus(), 300);
}

function clearAirportInput() {
    const input = document.getElementById('airport-search');
    const dropdown = document.getElementById('airport-dropdown');

    input.value = '';
    dropdown.classList.add('hidden');

    document.getElementById('airport-name').innerText = '';
    document.getElementById('init-width').value = '';
    document.getElementById('init-angle').value = '';

    selectedAirport = null; // ✅ สำคัญมาก

    initialSettings = { icao:'', ident: '', category:'', width: 0, angle: 0 };

    const catEl = document.getElementById('init-category');
    catEl.value = '';
    handleCategoryChange(catEl);    
    input.focus();
    toggleClearBtn();
    activeIndex = -1;
}

function handleAirportFocus(el) {
    const keyword = el.value.trim();
    if (keyword.length > 0) {
        // Re-show filtered results for whatever is already typed
        handleAirportSearch(keyword);
    } else {
        // Show first 20 airports so user can browse without flooding the list
        if (airportDB.length === 0) return;
        airportResults = airportDB.slice(0, 20);
        activeIndex = 0;
        renderAirportDropdown();
    }
}

function handleAirportInput(el) {
    let cleaned = el.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '');
    el.value = cleaned;

    debounceSearch(() => {
        handleAirportSearch(cleaned);
    }, 250);

    toggleClearBtn();
}

function toggleClearBtn() {
    const input = document.getElementById('airport-search');
    const btn = document.getElementById('clear-airport-btn');

    if (input.value.length > 0) {
        btn.classList.remove('hidden');
    } else {
        btn.classList.add('hidden');
    }
}

document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('airport-dropdown');
    const input = document.getElementById('airport-search');

    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.add('hidden');
    }
});

function handleAirportSearch(keyword) {
    const dropdown = document.getElementById('airport-dropdown');

    if (!keyword || airportDB.length === 0) {
        dropdown.classList.add('hidden');
        airportResults = [];
        activeIndex = -1;
        return;
    }

    const results = airportDB.filter(ap =>
        (ap.icao && ap.icao.includes(keyword)) ||
        (ap.iden && ap.iden.includes(keyword))
    );

    airportResults = results;
    activeIndex = 0; // 👈 เริ่มที่ตัวแรก

    renderAirportDropdown();
}

let activeIndex = -1;
let airportResults = [];

function handleAirportKeydown(e) {
    if (airportResults.length === 0) return;

    if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = (activeIndex + 1) % airportResults.length;
        renderAirportDropdown();
    }

    else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = (activeIndex - 1 + airportResults.length) % airportResults.length;
        renderAirportDropdown();
    }

    else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIndex >= 0) {
            selectAirport(airportResults[activeIndex]);

            setTimeout(() => {
                document.getElementById('init-width').focus();
            }, 50);
        }
    }
}

function saveToLocal() {
    localStorage.setItem('runs', JSON.stringify(currentRuns));
    localStorage.setItem('runCounter', String(runCounter));
}

// Returns true if a resumable session (station info) was found.
function loadFromLocal() {
    const initData = localStorage.getItem('initialSettings');
    if (!initData) return false;

    try {
        initialSettings = JSON.parse(initData);
    } catch (e) {
        return false;
    }

    if (!initialSettings || !initialSettings.ident) return false;

    document.getElementById('init-category').value = initialSettings.category || '';
    document.getElementById('init-width').value = initialSettings.width || '';
    document.getElementById('init-angle').value = initialSettings.angle || '';

    const runsData = localStorage.getItem('runs');
    if (runsData) {
        try { currentRuns = JSON.parse(runsData) || []; } catch (e) { currentRuns = []; }
    }
    const counterData = localStorage.getItem('runCounter');
    if (counterData) runCounter = parseInt(counterData, 10) || 0;

    return true;
}

function saveInitialToLocal() {
    localStorage.setItem('initialSettings', JSON.stringify(initialSettings));
}

function renderAirportDropdown() {
    const dropdown = document.getElementById('airport-dropdown');

    if (airportResults.length === 0) {
        dropdown.classList.add('hidden');
        return;
    }

    dropdown.innerHTML = airportResults.slice(0, 10).map((ap, i) => `
        <div id="airport-item-${i}"
             class="p-3 cursor-pointer border-b 
             ${i === activeIndex ? 'bg-blue-100' : 'hover:bg-blue-50'}"
             onclick="selectAirport(airportResults[${i}])">
             
            <div class="font-bold">${ap.icao} / ${ap.iden}</div>
            <div class="text-xs text-gray-500">${ap.airport}</div>
        </div>
    `).join('');

    dropdown.classList.remove('hidden');

    scrollToActiveItem();
}

function scrollToActiveItem() {
    const el = document.getElementById(`airport-item-${activeIndex}`);
    if (el) {
        el.scrollIntoView({
            block: 'nearest'
        });
    }
}

let debounceTimer;

function debounceSearch(callback, delay = 300) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(callback, delay);
}

function showLoading() {
    document.getElementById('global-loading').classList.add('active');
    document.body.classList.add('loading-lock');

    if (document.activeElement) {
        document.activeElement.blur();
    }
}

function hideLoading() {
    document.getElementById('global-loading').classList.remove('active');
    document.body.classList.remove('loading-lock');
}

function handleCategoryChange(el) {
    if (el.value === '') {
        el.classList.remove('text-slate-700');
        el.classList.add('text-slate-400'); // placeholder
    } else {
        el.classList.remove('text-slate-400');
        el.classList.add('text-slate-700'); // เลือกแล้ว
    }
}
